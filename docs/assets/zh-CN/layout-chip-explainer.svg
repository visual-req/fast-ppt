<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071423"/>
      <stop offset="52%" stop-color="#0a1e3b"/>
      <stop offset="100%" stop-color="#0d2748"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f3d"/>
      <stop offset="100%" stop-color="#11294c"/>
    </linearGradient>
    <linearGradient id="chipBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#113662"/>
      <stop offset="100%" stop-color="#0d2748"/>
    </linearGradient>
    <linearGradient id="lineStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4adeff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="techGlowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1210 190) rotate(90) scale(260)">
      <stop stop-color="#1d9bf0" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#1d9bf0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="techGlowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 700) rotate(90) scale(260)">
      <stop stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#60a5fa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020817" flood-opacity="0.42"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020817" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { fill: #eef6ff; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: rgba(210, 225, 245, 0.82); font-size: 18px; font-family: Arial, sans-serif; }
      .chipTag { fill: #8fdcff; font-size: 16px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .chipTitle { fill: #f8fbff; font-size: 34px; font-family: Arial, sans-serif; font-weight: 700; }
      .chipText { fill: #bfd4ef; font-size: 18px; font-family: Arial, sans-serif; }
      .cardTag { fill: #86c8ff; font-size: 12px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 1.5px; }
      .cardTitle { fill: #eef6ff; font-size: 24px; font-family: Arial, sans-serif; font-weight: 700; }
      .cardText { fill: rgba(214, 228, 247, 0.84); font-size: 16px; font-family: Arial, sans-serif; }
      .footerText { fill: #93adc9; font-size: 18px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="rgba(148, 197, 255, 0.24)" stroke-width="1.5" filter="url(#panelShadow)"/>
  <circle cx="1210" cy="190" r="260" fill="url(#techGlowA)"/>
  <circle cx="350" cy="700" r="260" fill="url(#techGlowB)"/>
