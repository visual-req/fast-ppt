<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="routeStroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fbaf4"/>
      <stop offset="100%" stop-color="#1d6fe8"/>
    </linearGradient>
    <linearGradient id="goalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4f97"/>
      <stop offset="100%" stop-color="#123b7a"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f7fe"/>
      <stop offset="55%" stop-color="#dde8f7"/>
      <stop offset="100%" stop-color="#c5d6ec"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9fb"/>
      <stop offset="52%" stop-color="#bcd4f3"/>
      <stop offset="100%" stop-color="#9fbde3"/>
    </linearGradient>
    <linearGradient id="mountainRidge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { fill: #143d7a; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .pill { fill: #1d4ed8; font-size: 11px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 1.4px; }
      .cardTitle { fill: #143d7a; font-size: 22px; font-family: Arial, sans-serif; font-weight: 700; }
      .cardText { fill: #475569; font-size: 16px; font-family: Arial, sans-serif; }
      .goalTitle { fill: #ffffff; font-size: 26px; font-family: Arial, sans-serif; font-weight: 700; }
      .goalText { fill: rgba(255,255,255,0.84); font-size: 17px; font-family: Arial, sans-serif; }
      .footerText { fill: #5b6b82; font-size: 18px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="#d7e3f4" stroke-width="1.5" filter="url(#panelShadow)"/>

  <text x="110" y="126" class="title">发展路线布局</text>
  <text x="110" y="164" class="subtle">沿左下到右上的上升路径，展示企业从现状基础逐步走向目标状态的发展路线与阶段重点。</text>

  <rect x="110" y="194" width="6" height="26" rx="3" fill="#1d6fe8"/>
  <text x="130" y="214" fill="#1d6fe8" font-size="20" font-family="Arial, sans-serif" font-weight="700">Preview Layout</text>

