  <path d="M146 778 C224 726 282 678 346 626 C412 572 470 518 528 460 C584 404 640 346 696 304 C756 258 816 230 874 230 C932 230 986 252 1036 288 C1088 326 1136 366 1188 396 C1246 430 1312 446 1394 428 L1394 778 Z" fill="rgba(255,255,255,0.14)"/>
