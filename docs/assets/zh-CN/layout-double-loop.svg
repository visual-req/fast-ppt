<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="loopStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d6fe8"/>
      <stop offset="50%" stop-color="#4da0ff"/>
      <stop offset="100%" stop-color="#1d6fe8"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { fill: #143d7a; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .loopTitle { fill: #1d6fe8; font-size: 24px; font-family: Arial, sans-serif; font-weight: 700; }
      .nodeText { fill: #143d7a; font-size: 20px; font-family: Arial, sans-serif; font-weight: 700; }
      .footerText { fill: #5b6b82; font-size: 18px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="#d7e3f4" stroke-width="1.5" filter="url(#panelShadow)"/>

  <text x="110" y="126" class="title">双循环布局</text>
  <text x="110" y="164" class="subtle">中间使用 ∞ 形主轨道，左右两个循环分别挂载节点，用于表达双闭环、双引擎或策略与执行协同。</text>

  <rect x="110" y="194" width="6" height="26" rx="3" fill="#1d6fe8"/>
  <text x="130" y="214" fill="#1d6fe8" font-size="20" font-family="Arial, sans-serif" font-weight="700">Preview Layout</text>

  <g transform="translate(25 -27) scale(1.1 1.04)">
  <rect x="200" y="236" width="220" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="310" y="267" class="loopTitle" text-anchor="middle">策略循环</text>

  <rect x="1090" y="236" width="220" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1200" y="267" class="loopTitle" text-anchor="middle">执行循环</text>

  <path d="M282 516 C282 380 430 330 572 450 C653 516 757 516 838 450 C980 330 1128 380 1128 516 C1128 652 980 702 838 582 C757 516 653 516 572 582 C430 702 282 652 282 516" fill="none" stroke="#d8e7fb" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M282 516 C282 380 430 330 572 450 C653 516 757 516 838 450 C980 330 1128 380 1128 516 C1128 652 980 702 838 582 C757 516 653 516 572 582 C430 702 282 652 282 516" fill="none" stroke="url(#loopStroke)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
  <path d="M282 516 C282 380 430 330 572 450 C653 516 757 516 838 450 C980 330 1128 380 1128 516 C1128 652 980 702 838 582 C757 516 653 516 572 582 C430 702 282 652 282 516" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 16"/>

  <circle cx="456" cy="388" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="322" y="344" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="399" y="377" class="nodeText" text-anchor="middle">洞察输入</text>

  <circle cx="314" cy="516" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="150" y="490" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="227" y="523" class="nodeText" text-anchor="middle">需求澄清</text>

  <circle cx="456" cy="644" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="320" y="654" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="397" y="687" class="nodeText" text-anchor="middle">方案建模</text>

  <circle cx="648" cy="516" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="554" y="466" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="631" y="499" class="nodeText" text-anchor="middle">机制校准</text>

  <circle cx="952" cy="388" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="974" y="344" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="1051" y="377" class="nodeText" text-anchor="middle">执行推进</text>

  <circle cx="1096" cy="516" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="1130" y="490" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="1207" y="523" class="nodeText" text-anchor="middle">数据回收</text>

  <circle cx="952" cy="644" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="976" y="654" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="1053" y="687" class="nodeText" text-anchor="middle">效果验证</text>

  <circle cx="762" cy="516" r="18" fill="#ffffff" stroke="#1d6fe8" stroke-width="8"/>
  <rect x="790" y="466" width="154" height="52" rx="18" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <text x="867" y="499" class="nodeText" text-anchor="middle">持续优化</text>
  </g>
</svg>
