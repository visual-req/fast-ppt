<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="200" y1="110" x2="1400" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#EEF4FB"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 180) rotate(90) scale(220)">
      <stop stop-color="#93C5FD" stop-opacity="0.24"/>
      <stop offset="0.56" stop-color="#93C5FD" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelBg" x1="112" y1="96" x2="1488" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FAFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="590" y1="140" x2="1010" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCEBFF"/>
      <stop offset="100%" stop-color="#B7D3FB"/>
    </linearGradient>
    <linearGradient id="blade" x1="676" y1="214" x2="924" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3F8FF"/>
      <stop offset="100%" stop-color="#C9DEFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D85FF"/>
      <stop offset="100%" stop-color="#1D6FE8"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D6FE8"/>
      <stop offset="100%" stop-color="#143D7A"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F7FF"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#143D7A" flood-opacity="0.08"/>
    </filter>
    <filter id="bladeShadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#143D7A" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { fill: #143D7A; font-size: 46px; font-family: Arial, sans-serif; font-weight: 800; }
      .subtle { fill: #64748B; font-size: 18px; font-family: Arial, sans-serif; }
      .cardTag { fill: #1D6FE8; font-size: 13px; font-family: Arial, sans-serif; font-weight: 800; letter-spacing: 1.2px; }
      .cardTitle { fill: #143D7A; font-size: 24px; font-family: Arial, sans-serif; font-weight: 800; }
      .cardText { fill: #475569; font-size: 16px; font-family: Arial, sans-serif; }
      .hubTag { fill: #FFFFFF; font-size: 14px; font-family: Arial, sans-serif; font-weight: 800; letter-spacing: 1.2px; }
      .hubTitle { fill: #143D7A; font-size: 30px; font-family: Arial, sans-serif; font-weight: 800; }
      .hubText { fill: #64748B; font-size: 16px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1240" cy="180" r="220" fill="url(#glowA)"/>

  <rect x="112" y="96" width="1376" height="708" rx="36" fill="url(#panelBg)" stroke="#D7E3F4" filter="url(#softShadow)"/>

  <text x="150" y="160" class="title">风扇式布局</text>
  <text x="150" y="198" class="subtle">以电风扇为主视觉，中间是风扇头与扇叶，四周分布 4 个解释模块，适合把一个核心主题向外吹散成结构化动作。</text>

  <g filter="url(#softShadow)">
    <rect x="248" y="182" width="250" height="108" rx="24" fill="url(#cardBg)" stroke="#D7E3F4"/>
    <rect x="248" y="182" width="8" height="108" rx="4" fill="url(#accent)"/>
    <text x="278" y="212" class="cardTag">PART 01</text>
    <text x="278" y="248" class="cardTitle">用户洞察</text>
    <text x="278" y="278" class="cardText">先识别关键对象、真实需求</text>

    <rect x="1102" y="182" width="250" height="108" rx="24" fill="url(#cardBg)" stroke="#D7E3F4"/>
    <rect x="1102" y="182" width="8" height="108" rx="4" fill="url(#accent)"/>
    <text x="1132" y="212" class="cardTag">PART 02</text>
    <text x="1132" y="248" class="cardTitle">方案设计</text>
    <text x="1132" y="278" class="cardText">拆解动作、节奏和责任分工</text>

    <rect x="248" y="556" width="250" height="108" rx="24" fill="url(#cardBg)" stroke="#D7E3F4"/>
    <rect x="248" y="556" width="8" height="108" rx="4" fill="url(#accent)"/>
    <text x="278" y="586" class="cardTag">PART 03</text>
    <text x="278" y="622" class="cardTitle">执行落地</text>
    <text x="278" y="652" class="cardText">推进资源协同与任务闭环</text>

    <rect x="1102" y="556" width="250" height="108" rx="24" fill="url(#cardBg)" stroke="#D7E3F4"/>
    <rect x="1102" y="556" width="8" height="108" rx="4" fill="url(#accent)"/>
    <text x="1132" y="586" class="cardTag">PART 04</text>
    <text x="1132" y="622" class="cardTitle">结果复盘</text>
    <text x="1132" y="652" class="cardText">沉淀经验并优化下一轮动作</text>
  </g>

  <g>
    <line x1="498" y1="290" x2="634" y2="326" stroke="#9FC2F7" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="1102" y1="290" x2="966" y2="326" stroke="#9FC2F7" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="498" y1="610" x2="634" y2="514" stroke="#9FC2F7" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="1102" y1="610" x2="966" y2="514" stroke="#9FC2F7" stroke-width="3" stroke-dasharray="8 8"/>
  </g>

  <g transform="translate(800 420)">
    <circle cx="0" cy="0" r="228" fill="rgba(147,197,253,0.16)"/>
    <circle cx="0" cy="0" r="204" fill="none" stroke="url(#ring)" stroke-width="22"/>
    <circle cx="0" cy="0" r="186" fill="none" stroke="#D8E8FD" stroke-width="2"/>

    <g stroke="#C9DDFB" stroke-width="2">
      <line x1="-170" y1="0" x2="170" y2="0"/>
      <line x1="0" y1="-170" x2="0" y2="170"/>
      <line x1="-120" y1="-120" x2="120" y2="120"/>
      <line x1="-120" y1="120" x2="120" y2="-120"/>
      <circle cx="0" cy="0" r="94" fill="none"/>
      <circle cx="0" cy="0" r="138" fill="none"/>
    </g>

    <g filter="url(#bladeShadow)">
      <ellipse cx="0" cy="-96" rx="56" ry="124" fill="url(#blade)" fill-opacity="0.98" stroke="#B7D4FB" stroke-width="2"/>
      <ellipse cx="0" cy="-96" rx="56" ry="124" fill="url(#blade)" fill-opacity="0.98" stroke="#B7D4FB" stroke-width="2" transform="rotate(120)"/>
      <ellipse cx="0" cy="-96" rx="56" ry="124" fill="url(#blade)" fill-opacity="0.98" stroke="#B7D4FB" stroke-width="2" transform="rotate(240)"/>
    </g>

    <circle cx="0" cy="0" r="66" fill="url(#accent)"/>
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" opacity="0.92"/>
  </g>

  <rect x="784" y="618" width="32" height="100" rx="16" fill="url(#stand)"/>
  <g filter="url(#softShadow)">
    <rect x="654" y="678" width="292" height="112" rx="34" fill="url(#cardBg)" stroke="#BFDBFE"/>
  </g>
  <rect x="736" y="698" width="128" height="28" rx="14" fill="url(#accent)"/>
  <text x="800" y="717" text-anchor="middle" class="hubTag">FAN CORE</text>
  <text x="800" y="758" text-anchor="middle" class="hubTitle">核心主题</text>
  <text x="800" y="784" text-anchor="middle" class="hubText">从一个核心主题向外吹散四个关键解释模块</text>

  <ellipse cx="800" cy="804" rx="136" ry="24" fill="#D8E8FD"/>
</svg>
