    <rect x="336" y="728" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="354" y="751" class="day">26</text>
    <rect x="524" y="728" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="542" y="751" class="day">27</text>
    <rect x="712" y="728" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="730" y="751" class="day">28</text>
    <rect x="900" y="728" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="918" y="751" class="day">29</text>
    <rect x="1088" y="728" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="1106" y="751" class="day">30</text>
    <rect x="1276" y="728" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="1294" y="751" class="day">31</text>
