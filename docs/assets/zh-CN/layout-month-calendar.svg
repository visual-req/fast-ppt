<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { fill: #143d7a; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .badge { fill: #1d6fe8; font-size: 18px; font-family: Arial, sans-serif; font-weight: 700; }
      .monthLabel { fill: #143d7a; font-size: 34px; font-family: Arial, sans-serif; font-weight: 700; }
      .headerNote { fill: #64748b; font-size: 14px; font-family: Arial, sans-serif; }
      .week { fill: #1d6fe8; font-size: 14px; font-family: Arial, sans-serif; font-weight: 700; }
      .day { fill: #143d7a; font-size: 18px; font-family: Arial, sans-serif; font-weight: 700; }
      .eventBlue { fill: #1d4ed8; font-size: 11px; font-family: Arial, sans-serif; font-weight: 700; }
      .eventGreen { fill: #15803d; font-size: 11px; font-family: Arial, sans-serif; font-weight: 700; }
      .eventAmber { fill: #b45309; font-size: 11px; font-family: Arial, sans-serif; font-weight: 700; }
      .eventRed { fill: #b91c1c; font-size: 11px; font-family: Arial, sans-serif; font-weight: 700; }
      .mutedDay { fill: #8ba0bb; font-size: 18px; font-family: Arial, sans-serif; font-weight: 700; }
      .legendText { fill: #64748b; font-size: 12px; font-family: Arial, sans-serif; font-weight: 700; }
      .footerText { fill: #5b6b82; font-size: 18px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="#d7e3f4" stroke-width="1.5" filter="url(#panelShadow)"/>

  <text x="110" y="126" class="title">月历布局</text>
  <text x="110" y="164" class="subtle">按月份展示日期格与关键事项，适合月度项目排期、运营节奏表、里程碑计划与会议日历。</text>

  <rect x="110" y="194" width="6" height="26" rx="3" fill="#1d6fe8"/>
  <text x="130" y="214" class="badge">Preview Layout</text>

  <rect x="120" y="248" width="1320" height="92" rx="28" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <rect x="154" y="274" width="126" height="28" rx="14" fill="rgba(29,111,232,0.08)"/>
  <text x="217" y="293" text-anchor="middle" fill="#1d6fe8" font-size="13" font-family="Arial, sans-serif" font-weight="700">MONTHLY VIEW</text>
  <text x="154" y="327" class="monthLabel">2026 / 08</text>
  <text x="350" y="326" class="headerNote">展示月度会议、投产节点、评审安排与复盘节奏</text>

  <circle cx="1110" cy="286" r="6" fill="rgba(29,111,232,0.16)"/>
  <text x="1124" y="290" class="legendText">关键会议</text>
  <circle cx="1220" cy="286" r="6" fill="rgba(245,158,11,0.16)"/>
  <text x="1234" y="290" class="legendText">里程碑</text>
  <circle cx="1110" cy="316" r="6" fill="rgba(22,163,74,0.16)"/>
  <text x="1124" y="320" class="legendText">已完成</text>
  <circle cx="1220" cy="316" r="6" fill="rgba(239,68,68,0.16)"/>
  <text x="1234" y="320" class="legendText">风险提醒</text>

  <rect x="148" y="360" width="176" height="36" rx="16" fill="rgba(29,111,232,0.08)"/><text x="236" y="383" text-anchor="middle" class="week">Mon</text>
  <rect x="336" y="360" width="176" height="36" rx="16" fill="rgba(29,111,232,0.08)"/><text x="424" y="383" text-anchor="middle" class="week">Tue</text>
  <rect x="524" y="360" width="176" height="36" rx="16" fill="rgba(29,111,232,0.08)"/><text x="612" y="383" text-anchor="middle" class="week">Wed</text>
