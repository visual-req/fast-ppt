    <rect x="524" y="488" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="542" y="511" class="day">6</text>
    <rect x="712" y="488" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="730" y="511" class="day">7</text>
    <rect x="900" y="488" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="918" y="511" class="day">8</text>
    <rect x="1088" y="488" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="1106" y="511" class="day">9</text>
    <rect x="1276" y="488" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="1294" y="511" class="day">10</text>
    <rect x="1292" y="520" width="126" height="20" rx="10" fill="rgba(245,158,11,0.14)"/><text x="1302" y="534" class="eventAmber">里程碑评审</text>
    <rect x="1292" y="542" width="110" height="20" rx="10" fill="rgba(22,163,74,0.12)"/><text x="1302" y="556" class="eventGreen">资料归档</text>
