  <rect x="110" y="812" width="1330" height="28" rx="14" fill="#f3f7fc" stroke="#d7e3f4"/>
  <text x="775" y="831" class="footerText" text-anchor="middle">适合“一个月内的节奏排布、事项同步、会议安排和关键日期提醒”的计划型页面。</text>
</svg>
