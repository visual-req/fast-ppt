    <rect x="524" y="648" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="542" y="671" class="day">20</text>
    <rect x="712" y="648" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="730" y="671" class="day">21</text>
    <rect x="900" y="648" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="918" y="671" class="day">22</text>
    <rect x="1088" y="648" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="1106" y="671" class="day">23</text>
    <rect x="1276" y="648" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="1294" y="671" class="day">24</text>
    <rect x="1292" y="682" width="110" height="20" rx="10" fill="rgba(22,163,74,0.12)"/><text x="1302" y="696" class="eventGreen">复盘会议</text>
  </g>

