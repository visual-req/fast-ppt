    <rect x="148" y="408" width="176" height="70" rx="20" fill="rgba(244,247,251,0.88)" stroke="#d7e3f4"/><text x="166" y="431" class="mutedDay">28</text>
    <rect x="336" y="408" width="176" height="70" rx="20" fill="rgba(244,247,251,0.88)" stroke="#d7e3f4"/><text x="354" y="431" class="mutedDay">29</text>
    <rect x="524" y="408" width="176" height="70" rx="20" fill="rgba(244,247,251,0.88)" stroke="#d7e3f4"/><text x="542" y="431" class="mutedDay">30</text>
    <rect x="712" y="408" width="176" height="70" rx="20" fill="rgba(244,247,251,0.88)" stroke="#d7e3f4"/><text x="730" y="431" class="mutedDay">31</text>
    <rect x="900" y="408" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="918" y="431" class="day">1</text>
    <rect x="1088" y="408" width="176" height="70" rx="20" fill="#ffffff" stroke="#d7e3f4"/><text x="1106" y="431" class="day">2</text>
