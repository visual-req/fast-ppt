<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <filter id="layerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1d4f9b" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b7bf0"/>
      <stop offset="100%" stop-color="#1a61cd"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#418fff"/>
      <stop offset="100%" stop-color="#2674e0"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64a5ff"/>
      <stop offset="100%" stop-color="#3583ea"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#90bdff"/>
      <stop offset="100%" stop-color="#5a98f1"/>
    </linearGradient>
    <style>
      .title { fill: #143d7a; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .badge { fill: #ffffff; font-size: 18px; font-family: Arial, sans-serif; font-weight: 700; }
      .layerTitle { fill: #ffffff; font-size: 28px; font-family: Arial, sans-serif; font-weight: 700; }
      .layerText { fill: rgba(255,255,255,0.92); font-size: 17px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="#d7e3f4" stroke-width="1.5" filter="url(#panelShadow)"/>

  <text x="110" y="126" class="title">能力金字塔</text>
  <text x="110" y="164" class="subtle">每一层使用一个独立梯形承载一个核心内容，从底座能力逐层走向最终价值。</text>

  <polygon points="745.6,208 854.4,208 923.6,320 676.4,320" fill="url(#layer1)" filter="url(#layerShadow)"/>
  <rect x="768" y="232" width="64" height="34" rx="17" fill="rgba(255,255,255,0.18)"/>
  <text x="800" y="255" class="badge" text-anchor="middle">01</text>
  <text x="800" y="286" class="layerTitle" text-anchor="middle">价值主张</text>
  <text x="800" y="304" class="layerText" text-anchor="middle">
    <tspan x="800" dy="0">最后对外传递的核心结论</tspan>
    <tspan x="800" dy="18">与业务价值</tspan>
  </text>

  <polygon points="657.9,350 942.1,350 1015.1,468 584.9,468" fill="url(#layer2)" filter="url(#layerShadow)"/>
  <rect x="768" y="374" width="64" height="34" rx="17" fill="rgba(255,255,255,0.18)"/>
  <text x="800" y="397" class="badge" text-anchor="middle">02</text>
  <text x="800" y="428" class="layerTitle" text-anchor="middle">关键能力</text>
  <text x="800" y="454" class="layerText" text-anchor="middle">承接目标达成所必需的方法、角色与机制</text>

  <polygon points="566.4,498 1033.6,498 1106.5,616 493.5,616" fill="url(#layer3)" filter="url(#layerShadow)"/>
  <rect x="768" y="522" width="64" height="34" rx="17" fill="rgba(255,255,255,0.18)"/>
  <text x="800" y="545" class="badge" text-anchor="middle">03</text>
  <text x="800" y="576" class="layerTitle" text-anchor="middle">方法流程</text>
  <text x="800" y="602" class="layerText" text-anchor="middle">把抽象目标转成阶段动作、步骤与交付标准</text>

  <polygon points="474.9,646 1125.1,646 1198,764 402,764" fill="url(#layer4)" filter="url(#layerShadow)"/>
  <rect x="768" y="670" width="64" height="34" rx="17" fill="rgba(255,255,255,0.18)"/>
  <text x="800" y="693" class="badge" text-anchor="middle">04</text>
  <text x="800" y="724" class="layerTitle" text-anchor="middle">基础资源</text>
  <text x="800" y="750" class="layerText" text-anchor="middle">数据、工具、知识库与协作底座共同支撑落地</text>
</svg>
