<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="lineStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { fill: #143d7a; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .centerTag { fill: #2563eb; font-size: 16px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .centerTitle { fill: #143d7a; font-size: 34px; font-family: Arial, sans-serif; font-weight: 700; }
      .centerText { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .cardTag { fill: #2563eb; font-size: 12px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 1.6px; }
      .cardTitle { fill: #143d7a; font-size: 24px; font-family: Arial, sans-serif; font-weight: 700; }
      .cardText { fill: #475569; font-size: 16px; font-family: Arial, sans-serif; }
      .footerText { fill: #5b6b82; font-size: 18px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="#d7e3f4" stroke-width="1.5" filter="url(#panelShadow)"/>

  <text x="110" y="126" class="title">中间大圆解释布局</text>
  <text x="110" y="164" class="subtle">中间承载核心议题，周围用 4 张说明卡对称展开关键模块、路径或能力解释。</text>

  <rect x="110" y="194" width="6" height="26" rx="3" fill="#1d6fe8"/>
  <text x="130" y="214" fill="#1d6fe8" font-size="20" font-family="Arial, sans-serif" font-weight="700">Preview Layout</text>

  <path d="M702 372 L646 316" fill="none" stroke="url(#lineStroke)" stroke-width="6" stroke-dasharray="10 10"/>
  <path d="M898 372 L954 316" fill="none" stroke="url(#lineStroke)" stroke-width="6" stroke-dasharray="10 10"/>
  <path d="M898 568 L954 624" fill="none" stroke="url(#lineStroke)" stroke-width="6" stroke-dasharray="10 10"/>
  <path d="M702 568 L646 624" fill="none" stroke="url(#lineStroke)" stroke-width="6" stroke-dasharray="10 10"/>

  <circle cx="646" cy="316" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="8"/>
  <circle cx="954" cy="316" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="8"/>
  <circle cx="954" cy="624" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="8"/>
  <circle cx="646" cy="624" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="8"/>

  <circle cx="800" cy="470" r="220" fill="rgba(147,197,253,0.14)"/>
  <circle cx="800" cy="470" r="172" fill="none" stroke="#93c5fd" stroke-width="4" stroke-dasharray="12 10"/>
  <circle cx="800" cy="470" r="138" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="738" y="402" width="124" height="30" rx="15" fill="#eff6ff"/>
  <text x="800" y="423" class="centerTag" text-anchor="middle">CENTER</text>
  <text x="800" y="474" class="centerTitle" text-anchor="middle">核心议题</text>
  <text x="800" y="508" class="centerText" text-anchor="middle">围绕中心主题向外展开关键解释</text>

  <rect x="1030" y="160" width="250" height="102" rx="22" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <rect x="1030" y="160" width="7" height="102" rx="3.5" fill="#2563eb"/>
  <text x="1058" y="188" class="cardTag">TOPIC 01</text>
  <text x="1058" y="222" class="cardTitle">目标定义</text>
  <text x="1058" y="252" class="cardText">明确总目标、边界和评价口径</text>

  <rect x="1030" y="626" width="250" height="102" rx="22" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <rect x="1030" y="626" width="7" height="102" rx="3.5" fill="#2563eb"/>
  <text x="1058" y="654" class="cardTag">TOPIC 02</text>
  <text x="1058" y="688" class="cardTitle">执行路径</text>
  <text x="1058" y="718" class="cardText">把目标拆成关键动作与里程碑</text>

  <rect x="320" y="626" width="250" height="102" rx="22" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <rect x="320" y="626" width="7" height="102" rx="3.5" fill="#2563eb"/>
  <text x="348" y="654" class="cardTag">TOPIC 03</text>
  <text x="348" y="688" class="cardTitle">支撑能力</text>
  <text x="348" y="718" class="cardText">平台、工具、机制共同支撑落地</text>

  <rect x="320" y="160" width="250" height="102" rx="22" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <rect x="320" y="160" width="7" height="102" rx="3.5" fill="#2563eb"/>
  <text x="348" y="188" class="cardTag">TOPIC 04</text>
  <text x="348" y="222" class="cardTitle">责任分工</text>
  <text x="348" y="252" class="cardText">明确角色边界与协同关系</text>

  <rect x="110" y="798" width="1330" height="24" rx="12" fill="#f3f7fc" stroke="#d7e3f4"/>
  <text x="775" y="815" class="footerText" text-anchor="middle">适合“核心议题 + 周边 4 个说明模块”的一页式解释、能力拆解、方法论展开与方案总览页面。</text>
</svg>
