<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="frameBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163b76"/>
      <stop offset="100%" stop-color="#0f274f"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a5f" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { fill: #143d7a; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .screenTag, .windowTag { fill: #1d6fe8; font-size: 11px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 0.08em; }
      .screenTitle { fill: #143d7a; font-size: 30px; font-family: Arial, sans-serif; font-weight: 700; }
      .screenText { fill: #475569; font-size: 15px; font-family: Arial, sans-serif; }
      .windowTitle { fill: #143d7a; font-size: 19px; font-family: Arial, sans-serif; font-weight: 700; }
      .windowText { fill: #475569; font-size: 13px; font-family: Arial, sans-serif; }
      .footerText { fill: #5b6b82; font-size: 18px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="#d7e3f4" stroke-width="1.5" filter="url(#panelShadow)"/>

  <text x="110" y="126" class="title">解释性布局</text>
  <text x="110" y="164" class="subtle">中间放置大屏幕承载核心界面，四周用轻悬浮窗解释关键模块、动作与信息点，适合讲解系统界面与产品能力。</text>

  <circle cx="1260" cy="180" r="150" fill="rgba(147,197,253,0.12)"/>
  <circle cx="336" cy="690" r="180" fill="rgba(147,197,253,0.12)"/>

  <g filter="url(#softShadow)">
    <rect x="520" y="228" width="560" height="372" rx="28" fill="url(#frameBg)"/>
    <circle cx="554" cy="254" r="5" fill="rgba(255,255,255,0.42)"/>
    <circle cx="572" cy="254" r="5" fill="rgba(255,255,255,0.42)"/>
    <circle cx="590" cy="254" r="5" fill="rgba(255,255,255,0.42)"/>
    <rect x="540" y="272" width="520" height="306" rx="18" fill="#f8fbff" stroke="#bfdafe"/>
    <rect x="564" y="298" width="84" height="24" rx="12" fill="rgba(29,111,232,0.08)"/>
    <text x="606" y="314" text-anchor="middle" class="screenTag">SCREEN</text>
    <text x="800" y="382" text-anchor="middle" class="screenTitle">统一运营驾驶舱</text>
    <text x="800" y="418" text-anchor="middle" class="screenText">把关键指标、主流程和当前状态放在中间大屏幕中。</text>
    <text x="800" y="442" text-anchor="middle" class="screenText">周围浮窗负责解释不同模块与动作含义。</text>
    <rect x="578" y="470" width="444" height="72" rx="18" fill="#eef4fb" stroke="#d7e3f4"/>
    <rect x="602" y="492" width="120" height="12" rx="6" fill="#93c5fd"/>
    <rect x="742" y="492" width="90" height="12" rx="6" fill="#60a5fa"/>
    <rect x="852" y="492" width="148" height="12" rx="6" fill="#2563eb"/>
  </g>
  <rect x="734" y="620" width="132" height="18" rx="9" fill="rgba(29,111,232,0.18)"/>

  <g transform="translate(238 188) rotate(-7)" filter="url(#softShadow)">
    <rect width="250" height="138" rx="22" fill="rgba(255,255,255,0.82)" stroke="rgba(255,255,255,0.52)"/>
    <circle cx="24" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="42" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="60" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <rect x="20" y="42" width="82" height="22" rx="11" fill="rgba(29,111,232,0.08)"/>
    <text x="61" y="57" text-anchor="middle" class="windowTag">模块 01</text>
    <text x="20" y="88" class="windowTitle">任务入口</text>
    <text x="20" y="112" class="windowText">集中承载待办、提醒</text>
    <text x="20" y="132" class="windowText">和优先动作。</text>
  </g>

  <g transform="translate(1110 176) rotate(6)" filter="url(#softShadow)">
    <rect width="250" height="138" rx="22" fill="rgba(255,255,255,0.82)" stroke="rgba(255,255,255,0.52)"/>
    <circle cx="24" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="42" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="60" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <rect x="20" y="42" width="82" height="22" rx="11" fill="rgba(29,111,232,0.08)"/>
    <text x="61" y="57" text-anchor="middle" class="windowTag">模块 02</text>
    <text x="20" y="88" class="windowTitle">数据透视</text>
    <text x="20" y="112" class="windowText">以浮窗方式解释关键</text>
    <text x="20" y="132" class="windowText">指标与异常。</text>
  </g>

  <g transform="translate(228 626) rotate(5)" filter="url(#softShadow)">
    <rect width="250" height="138" rx="22" fill="rgba(255,255,255,0.82)" stroke="rgba(255,255,255,0.52)"/>
    <circle cx="24" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="42" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="60" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <rect x="20" y="42" width="82" height="22" rx="11" fill="rgba(29,111,232,0.08)"/>
    <text x="61" y="57" text-anchor="middle" class="windowTag">模块 03</text>
    <text x="20" y="88" class="windowTitle">协同动作</text>
    <text x="20" y="112" class="windowText">说明跨角色协同与</text>
    <text x="20" y="132" class="windowText">操作链路。</text>
  </g>

  <g transform="translate(1120 610) rotate(-6)" filter="url(#softShadow)">
    <rect width="250" height="138" rx="22" fill="rgba(255,255,255,0.82)" stroke="rgba(255,255,255,0.52)"/>
    <circle cx="24" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="42" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <circle cx="60" cy="22" r="5" fill="rgba(255,255,255,0.5)"/>
    <rect x="20" y="42" width="82" height="22" rx="11" fill="rgba(29,111,232,0.08)"/>
    <text x="61" y="57" text-anchor="middle" class="windowTag">模块 04</text>
    <text x="20" y="88" class="windowTitle">闭环反馈</text>
    <text x="20" y="112" class="windowText">解释结果回收、复盘</text>
    <text x="20" y="132" class="windowText">与优化。</text>
  </g>

  <rect x="110" y="800" width="1330" height="28" rx="14" fill="#f3f7fc" stroke="#d7e3f4"/>
  <text x="775" y="819" class="footerText" text-anchor="middle">适合“中间是核心界面，周围是空气感浮窗解释”的产品讲解页、系统说明页和驾驶舱解读页。</text>
</svg>
