  <rect x="86" y="58" width="1428" height="784" rx="38" fill="url(#panelBg)" stroke="#D7E3F4" filter="url(#panelShadow)"/>

  <rect x="148" y="122" width="190" height="42" rx="21" fill="#E8F1FF"/>
  <text x="243" y="150" text-anchor="middle" fill="#1D6FE8" font-size="18" font-family="Arial, sans-serif" font-weight="800" letter-spacing="2">STAFF BAR</text>
  <text x="148" y="220" fill="#143D7A" font-size="42" font-family="Arial, sans-serif" font-weight="800">金箍棒分段布局</text>
  <text x="148" y="260" fill="#64748B" font-size="20" font-family="Arial, sans-serif">整体是一根横向 bar，两端做成金箍棒端头装饰，中间分割位置严格按照百分比落位，适合结构占比、阶段配比和资源分布页。</text>

