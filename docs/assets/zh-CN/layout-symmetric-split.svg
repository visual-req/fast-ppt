<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7fb"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(77,160,255,0)"/>
      <stop offset="18%" stop-color="#7eb8ff"/>
      <stop offset="50%" stop-color="#1d6fe8"/>
      <stop offset="82%" stop-color="#7eb8ff"/>
      <stop offset="100%" stop-color="rgba(77,160,255,0)"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4da0ff"/>
      <stop offset="100%" stop-color="#1d6fe8"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a5f" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { fill: #143d7a; font-size: 46px; font-family: Arial, sans-serif; font-weight: 700; }
      .subtle { fill: #64748b; font-size: 18px; font-family: Arial, sans-serif; }
      .tag { fill: #1d6fe8; font-size: 13px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 0.1em; }
      .panelTitle { fill: #143d7a; font-size: 28px; font-family: Arial, sans-serif; font-weight: 700; }
      .bullet { fill: #334155; font-size: 18px; font-family: Arial, sans-serif; }
      .footerText { fill: #5b6b82; font-size: 18px; font-family: Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect x="54" y="44" width="1492" height="812" rx="36" fill="url(#panelBg)" stroke="#d7e3f4" stroke-width="1.5" filter="url(#panelShadow)"/>

  <text x="110" y="126" class="title">左右对称布局</text>
  <text x="110" y="164" class="subtle">左右两侧以相同容器与层级镜像展开，中间设置轴线与中心标识，适合双对象、双路径与双能力的平衡呈现。</text>

  <rect x="120" y="248" width="572" height="514" rx="30" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>
  <rect x="908" y="248" width="572" height="514" rx="30" fill="#ffffff" stroke="#d7e3f4" filter="url(#softShadow)"/>

  <circle cx="800" cy="505" r="38" fill="url(#badgeBg)" filter="url(#softShadow)"/>
  <text x="800" y="513" text-anchor="middle" fill="#ffffff" font-size="22" font-family="Arial, sans-serif" font-weight="700">VS</text>
  <rect x="799" y="180" width="2" height="568" fill="url(#blueLine)"/>

  <rect x="156" y="282" width="106" height="28" rx="14" fill="rgba(29,111,232,0.08)"/>
  <text x="209" y="301" text-anchor="middle" class="tag">SUPPLY</text>
  <text x="156" y="348" class="panelTitle">平台能力</text>
  <line x1="156" y1="376" x2="656" y2="376" stroke="#d7e3f4"/>
  <circle cx="174" cy="434" r="7" fill="#4da0ff"/>
  <text x="196" y="440" class="bullet">统一底座：沉淀能力组件与标准配置</text>
  <circle cx="174" cy="500" r="7" fill="#4da0ff"/>
  <text x="196" y="506" class="bullet">服务编排：按场景组合流程与接口能力</text>
  <circle cx="174" cy="566" r="7" fill="#4da0ff"/>
  <text x="196" y="572" class="bullet">指标看板：把运行状态与结果持续可视化</text>

  <rect x="1338" y="282" width="106" height="28" rx="14" fill="rgba(29,111,232,0.08)"/>
  <text x="1391" y="301" text-anchor="middle" class="tag">DEMAND</text>
  <text x="1444" y="348" text-anchor="end" class="panelTitle">业务价值</text>
  <line x1="944" y1="376" x2="1444" y2="376" stroke="#d7e3f4"/>
  <circle cx="1426" cy="434" r="7" fill="#4da0ff"/>
  <text x="1404" y="440" text-anchor="end" class="bullet">场景落地：把能力落到真实业务任务上</text>
  <circle cx="1426" cy="500" r="7" fill="#4da0ff"/>
  <text x="1404" y="506" text-anchor="end" class="bullet">流程提效：缩短协同链路与处理时长</text>
  <circle cx="1426" cy="566" r="7" fill="#4da0ff"/>
  <text x="1404" y="572" text-anchor="end" class="bullet">结果复盘：形成闭环反馈与持续优化</text>

  <rect x="110" y="800" width="1330" height="28" rx="14" fill="#f3f7fc" stroke="#d7e3f4"/>
  <text x="775" y="819" class="footerText" text-anchor="middle">适合“左侧一组、右侧一组，且结构和权重完全对称”的说明页、对照页和能力页。</text>
</svg>
